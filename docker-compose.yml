version: '3.8'

services:
  middleware-datasources:
    container_name: middlewaredatasources
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "8383:8080"
    restart: unless-stopped
    environment:
      # Puerto interno donde escucha Node
      PORT: ${PORT:-8080}

      # Otros 
      EUSER: ${EUSER}
      EPASS: ${EPASS}
      EHOST: ${EHOST}
      EPORT: ${EPORT}
      SEED: ${SEED}
      TIME_TOKEN: ${TIME_TOKEN}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      ZACATUCHE_HOST: ${ZACATUCHE_HOST}
      MANATI_HOST: ${MANATI_HOST}
      SPECIES_HOST: ${SPECIES_HOST}
      MIDDLEWARE_HOST: ${MIDDLEWARE_HOST}
      REGIONS_HOST: ${REGIONS_HOST}
      SNIB_HOST: ${SNIB_HOST}
      WORLDCLIM_HOST: ${WORLDCLIM_HOST}
      GBIF_HOST: ${GBIF_HOST}
      DEM_HOST: ${DEM_HOST}
      USOSUELO_HOST: ${USOSUELO_HOST}

      # auth_backend: valida el sessionid (Mi cuenta, historial, Mis datos).
      # Sin esto ninguna sesión se reconoce y esos endpoints responden 401.
      AUTH_BACKEND_URL: ${AUTH_BACKEND_URL}

      # Base de datos malla/regiones
      MESH_DB_HOST: ${MESH_DB_HOST}
      MESH_DB_PORT: ${MESH_DB_PORT}
      MESH_DB_NAME: ${MESH_DB_NAME}
      MESH_DB_USER: ${MESH_DB_USER}
      MESH_DB_PWD: ${MESH_DB_PWD}
      # Opcionales: por omisión, mismo servidor/usuario que MESH_DB_* con la base species_users_db.
      USERS_DB_HOST: ${USERS_DB_HOST:-}
      USERS_DB_PORT: ${USERS_DB_PORT:-}
      USERS_DB_NAME: ${USERS_DB_NAME:-}
      USERS_DB_USER: ${USERS_DB_USER:-}
      USERS_DB_PWD: ${USERS_DB_PWD:-}

      # Redis (clave)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis_middlewaredatasources
    restart: unless-stopped
    # Solo es caché con expiración (análisis de Nicho 15 min, redes 1 h; una
    # red grande puede ocupar decenas de MB). Tope de memoria: al llenarse se
    # descartan primero las llaves con TTL más viejas (el front ya avisa
    # "análisis expirado"). Sin snapshots RDB: no hace falta persistir y el
    # fork de cada snapshot puede duplicar la memoria usada.
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "volatile-lru", "--save", ""]

